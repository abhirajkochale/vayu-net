experiment_name: "EXP-M3"
description: "VAYU-NET Multimodal Multi-Task Controlled Ablation: Granular Spatially Adaptive Fusion"
random_seed: 42

dataset:
  manifest_path: "data/manifests/gridsat_imerg_multimodal_dataset_manifest.csv"
  tensor_cache_path: "data/interim/ml/exp_m1_tensor_cache.pt"
  imerg_train_normalization: "data/interim/ml/imerg_train_normalization_stats.json"
  sequence_length: 6
  spatial_shape: [72, 116]

training:
  batch_size: 16   # LOCKED to 16 matching validated M1A protocol
  max_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  scheduler:
    name: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.5
    patience: 2
    min_lr: 0.00001
  early_stopping:
    patience: 5
    monitor: "val_total_loss"

architecture:
  spatial_dim: 64
  gru_dim: 64
  latent_dim: 64
  dropout: 0.1
  unidirectional_gru: true
  spatial_gate_hidden: 32

loss_weights:
  lambda_center: 1.0
  lambda_wind: 1.0
  lambda_class: 1.0
  lambda_track: 1.0

models:
  m3a_gridsat:
    mode: "m3a_gridsat"
    checkpoint: "ml/experiments/exp_m3/checkpoints/m3a_gridsat_only.pt"
  m3b_imerg:
    mode: "m3b_imerg"
    checkpoint: "ml/experiments/exp_m3/checkpoints/m3b_imerg_only.pt"
  m3c_spatial:
    mode: "m3c_spatial"
    checkpoint: "ml/experiments/exp_m3/checkpoints/m3c_spatial_adaptive_fusion.pt"
